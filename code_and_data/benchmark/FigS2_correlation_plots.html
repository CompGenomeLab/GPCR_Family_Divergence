<script>
/* ========================= CONFIG ========================= */
const CONS_THR = 75.27; // Conservation threshold for filtering
const CLASSA_LABELS = "data/HRH2_entropy_conservation.txt";

// Panel configurations for all continuous metrics
const CONSOLIDATED_mapping_tsv_path = "Consolidated_GPCR_mapping.tsv"; // Single consolidated mapping file

const V2R_expression_path = "data/V2R_expression.tsv";

const COMBINED_significance_tsv_path = "data/Combined_mutational_intolerance.tsv";
const COMBINED_scatter_hrh2_path = CLASSA_LABELS;

const ADRB2_emax_tsv_path = "data/ADRB2_Emax_Gprotein.tsv";
const ADRB2_barr_tsv_path = "data/ADRB2_BetaArrestin_EC100.tsv";

const CLINVAR_tsv_path = "data/ClinVar_aggregated_pathogenicity.txt";
const CLINVAR_scatter_hrh2_path = CLASSA_LABELS;

const ADRB2_ec100_alanine_path = "data/EC100_alanine_scanning.txt";
const ADRB2_ec100_scatter_hrh2_path = CLASSA_LABELS;

/* ========================= Colors & Layout ========================= */
const COLOR_GREY = "#D3D3D3";
const COLOR_BLUE = "#1f77b4";

// Layout for 3 plots per row
const PANEL_WIDTH = 500, PANEL_HEIGHT = 400;
const PANEL_MARGIN = {top: 60, right: 20, bottom: 60, left: 70};
const PANEL_SPACING_X = 80, PANEL_SPACING_Y = 40;

/* ========================= Utilities ========================= */
function firstInt(s){ const m=String(s??"").match(/\d+/); return m?parseInt(m[0],10):null; }
function toNum(v){ const x=Number(v); return Number.isFinite(x)?x:null; }

function readTSV(path){
  return new Promise((resolve, reject) => {
    Papa.parse(path, { delimiter:"\t", header:true, download:true,
      complete: res => resolve(res.data.filter(r => Object.keys(r).length>0)),
      error: err => reject(err)
    });
  });
}

async function readXLSX_firstSheet(path){
  const resp = await fetch(path); const buf = await resp.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"}); const sh = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sh, { raw:true, defval:null });
}

/* ========================= Statistical Functions ========================= */
function pearsonCorrelation(x, y) {
  const n = x.length;
  if (n !== y.length || n === 0) return { r: NaN, p: NaN };
  
  const sumX = x.reduce((a, b) => a + b, 0);
  const sumY = y.reduce((a, b) => a + b, 0);
  const sumXY = x.reduce((sum, xi, i) => sum + xi * y[i], 0);
  const sumX2 = x.reduce((sum, xi) => sum + xi * xi, 0);
  const sumY2 = y.reduce((sum, yi) => sum + yi * yi, 0);
  
  const numerator = n * sumXY - sumX * sumY;
  const denominator = Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));
  
  const r = denominator === 0 ? NaN : numerator / denominator;
  
  // Calculate p-value using t-test
  if (isNaN(r) || n < 3) return { r, p: NaN };
  const t = r * Math.sqrt((n - 2) / (1 - r * r));
  const p = 2 * (1 - jStat.studentt.cdf(Math.abs(t), n - 2));
  
  return { r, p };
}

function linearRegression(x, y) {
  const n = x.length;
  const sumX = x.reduce((a, b) => a + b, 0);
  const sumY = y.reduce((a, b) => a + b, 0);
  const sumXY = x.reduce((sum, xi, i) => sum + xi * y[i], 0);
  const sumX2 = x.reduce((sum, xi) => sum + xi * xi, 0);
  
  const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
  const intercept = (sumY - slope * sumX) / n;
  
  return { slope, intercept };
}

/* ========================= Drawing Function ========================= */
function drawCorrelationPanel({svg, x, y, title, data, xLabel, yLabel, letter}) {
  const g = svg.append("g")
    .attr("transform", `translate(${x}, ${y})`);

  // Extract x and y values
  const xValues = data.map(d => d.x);
  const yValues = data.map(d => d.y);

  // Scales
  const xScale = d3.scaleLinear()
    .domain(d3.extent(xValues))
    .range([PANEL_MARGIN.left, PANEL_WIDTH - PANEL_MARGIN.right])
    .nice();

  const yScale = d3.scaleLinear()
    .domain(d3.extent(yValues))
    .range([PANEL_HEIGHT - PANEL_MARGIN.bottom, PANEL_MARGIN.top])
    .nice();

  // Axes
  const xAxis = d3.axisBottom(xScale).ticks(5);
  const yAxis = d3.axisLeft(yScale).ticks(5);

  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0, ${PANEL_HEIGHT - PANEL_MARGIN.bottom})`)
    .call(xAxis);

  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${PANEL_MARGIN.left}, 0)`)
    .call(yAxis);

  // Axis labels
  g.append("text")
    .attr("class", "axis-label")
    .attr("text-anchor", "middle")
    .attr("x", (PANEL_MARGIN.left + PANEL_WIDTH - PANEL_MARGIN.right) / 2)
    .attr("y", PANEL_HEIGHT - 10)
    .text(xLabel);

  g.append("text")
    .attr("class", "axis-label")
    .attr("text-anchor", "middle")
    .attr("transform", `translate(15, ${(PANEL_MARGIN.top + PANEL_HEIGHT - PANEL_MARGIN.bottom) / 2}) rotate(-90)`)
    .text(yLabel);

  // Letter label at top-left (a., b., etc.)
  if (letter) {
    g.append("text")
      .attr("class", "panel-title")
      .attr("x", 5)
      .attr("y", 25)
      .attr("font-weight", "700")
      .text(`${letter}.`);
  }

  // Title - handle multi-line titles separated by "|"
  const titleLines = title.split("|");
  const titleX = (PANEL_MARGIN.left + PANEL_WIDTH - PANEL_MARGIN.right) / 2;
  
  if (titleLines.length > 1) {
    // Multi-line title
    titleLines.forEach((line, i) => {
      g.append("text")
        .attr("class", "panel-title")
        .attr("text-anchor", "middle")
        .attr("x", titleX)
        .attr("y", 20 + i * 18)
        .text(line.trim());
    });
  } else {
    // Single line title
    g.append("text")
      .attr("class", "panel-title")
      .attr("text-anchor", "middle")
      .attr("x", titleX)
      .attr("y", 25)
      .text(title);
  }

  // Calculate correlation and regression
  const { r, p } = pearsonCorrelation(xValues, yValues);
  const { slope, intercept } = linearRegression(xValues, yValues);

  // Draw regression line (clipped to axis bounds)
  const xMin = d3.min(xValues);
  const xMax = d3.max(xValues);
  const yMin = d3.min(yValues);
  const yMax = d3.max(yValues);
  
  // Calculate line endpoints and clip to data range
  let x1 = xMin, y1 = slope * xMin + intercept;
  let x2 = xMax, y2 = slope * xMax + intercept;
  
  // Clip y1 to yMin/yMax
  if (y1 < yMin) { y1 = yMin; x1 = (yMin - intercept) / slope; }
  if (y1 > yMax) { y1 = yMax; x1 = (yMax - intercept) / slope; }
  
  // Clip y2 to yMin/yMax
  if (y2 < yMin) { y2 = yMin; x2 = (yMin - intercept) / slope; }
  if (y2 > yMax) { y2 = yMax; x2 = (yMax - intercept) / slope; }

  g.append("line")
    .attr("class", "regression-line")
    .attr("x1", xScale(x1))
    .attr("y1", yScale(y1))
    .attr("x2", xScale(x2))
    .attr("y2", yScale(y2));

  // Draw data points
  const tooltip = d3.select("#tooltip");

  g.selectAll(".data-point")
    .data(data)
    .enter().append("circle")
    .attr("class", "data-point")
    .attr("cx", d => xScale(d.x))
    .attr("cy", d => yScale(d.y))
    .attr("r", 4)
    .attr("fill", COLOR_GREY)
    .attr("opacity", 0.6)
    .attr("stroke", "none")
    .on("mouseover", function(event, d) {
      d3.select(this).attr("r", 6).attr("opacity", 1).attr("stroke", "#000").attr("stroke-width", 1.5);
      tooltip.style("opacity", 1)
        .html(`
          <div><b>x:</b> ${d.x.toFixed(3)}</div>
          <div><b>y:</b> ${d.y.toFixed(2)}</div>
        `);
    })
    .on("mousemove", function(event) {
      tooltip.style("left", (event.pageX + 15) + "px")
        .style("top", (event.pageY - 15) + "px");
    })
    .on("mouseout", function() {
      d3.select(this).attr("r", 4).attr("opacity", 0.6).attr("stroke", "none");
      tooltip.style("opacity", 0);
    });

  // Find sparsest corner for text placement
  // Divide plot into 9 sections (3x3 grid) and check corners
  const plotXMin = xScale.domain()[0];
  const plotXMax = xScale.domain()[1];
  const plotYMin = yScale.domain()[0];
  const plotYMax = yScale.domain()[1];
  
  const xThird = (plotXMax - plotXMin) / 3;
  const yThird = (plotYMax - plotYMin) / 3;
  
  // Define 4 corner regions
  const corners = [
    { name: "top-left", xMin: plotXMin, xMax: plotXMin + xThird, yMin: plotYMax - yThird, yMax: plotYMax, textX: PANEL_MARGIN.left + 10, textY: PANEL_MARGIN.top + 10, anchor: "start" },
    { name: "top-right", xMin: plotXMax - xThird, xMax: plotXMax, yMin: plotYMax - yThird, yMax: plotYMax, textX: PANEL_WIDTH - PANEL_MARGIN.right - 10, textY: PANEL_MARGIN.top + 10, anchor: "end" },
    { name: "bottom-left", xMin: plotXMin, xMax: plotXMin + xThird, yMin: plotYMin, yMax: plotYMin + yThird, textX: PANEL_MARGIN.left + 10, textY: PANEL_HEIGHT - PANEL_MARGIN.bottom - 30, anchor: "start" },
    { name: "bottom-right", xMin: plotXMax - xThird, xMax: plotXMax, yMin: plotYMin, yMax: plotYMin + yThird, textX: PANEL_WIDTH - PANEL_MARGIN.right - 10, textY: PANEL_HEIGHT - PANEL_MARGIN.bottom - 30, anchor: "end" }
  ];
  
  // Count points in each corner
  corners.forEach(corner => {
    corner.count = data.filter(d => 
      d.x >= corner.xMin && d.x <= corner.xMax && 
      d.y >= corner.yMin && d.y <= corner.yMax
    ).length;
  });
  
  // Find corner with fewest points
  const sparsestCorner = corners.reduce((min, corner) => corner.count < min.count ? corner : min);
  
  // Display correlation text in sparsest corner with background box
  let pText;
  if (p < 1e-15 || p === 0) {
    pText = "p < 1e-15";
  } else if (p < 0.001) {
    pText = `p = ${p.toExponential(2)}`;
  } else {
    pText = `p = ${p.toFixed(4)}`;
  }
  const rText = `r = ${r.toFixed(3)}, ${pText}`;
  const nText = `n = ${data.length}`;
  
  // Estimate text dimensions
  const charWidth = 7; // approximate width per character
  const line1Width = rText.length * charWidth;
  const line2Width = nText.length * 6; // smaller font
  const maxTextWidth = Math.max(line1Width, line2Width);
  const boxPadding = 8;
  const boxWidth = maxTextWidth + 2 * boxPadding;
  const boxHeight = 40;
  
  // Calculate box position based on anchor
  let boxX = sparsestCorner.textX - boxPadding;
  if (sparsestCorner.anchor === "end") {
    boxX = sparsestCorner.textX - maxTextWidth - boxPadding;
  }
  
  // Draw background box
  g.append("rect")
    .attr("class", "stats-box")
    .attr("x", boxX)
    .attr("y", sparsestCorner.textY - 15)
    .attr("width", boxWidth)
    .attr("height", boxHeight)
    .attr("rx", 3)
    .attr("ry", 3);
  
  // Draw text on top of box
  g.append("text")
    .attr("class", "correlation-text")
    .attr("x", sparsestCorner.textX)
    .attr("y", sparsestCorner.textY)
    .attr("text-anchor", sparsestCorner.anchor)
    .text(rText);

  g.append("text")
    .attr("class", "correlation-text")
    .attr("x", sparsestCorner.textX)
    .attr("y", sparsestCorner.textY + 20)
    .attr("text-anchor", sparsestCorner.anchor)
    .style("font-size", "12px")
    .text(nText);
}

/* ========================= Data Preparation Functions ========================= */
async function prepareData_ADRB2_Tolerance() {
  const [tol, map, hrh2] = await Promise.all([
    readXLSX_firstSheet(ADRB2_tolerance_xls_path),
    readTSV(CONSOLIDATED_mapping_tsv_path),
    readTSV(ADRB2_scatter_data_path)
  ]);

  const tolRows = tol.filter(r => Math.abs(Number(r.Condition) - ADRB2_tol_condition_value) < 1e-6)
    .map(r => ({ adrb2_pos: toNum(r.Pos), tolerance: toNum(r.Tolerance) }))
    .filter(r => r.adrb2_pos != null && r.tolerance != null);

  const mapRows = map.map(r => ({
    hrh2_int: firstInt(r.HRH2_resNum),
    adrb2_int: firstInt(r.ADRB2_resNum)
  })).filter(r => r.hrh2_int && r.adrb2_int);

  const hrh2Rows = hrh2.map(r => ({
    hrh2_int: firstInt(r.HRH2_res_no),
    entropy: toNum(r.entropy),
    conservation: toNum(r.conservation)
  })).filter(r => r.hrh2_int && r.entropy != null && r.conservation != null);

  const joined = [];
  for (const t of tolRows) {
    const m = mapRows.find(k => k.adrb2_int === t.adrb2_pos);
    if (!m) continue;
    const h = hrh2Rows.find(h => h.hrh2_int === m.hrh2_int);
    if (!h) continue;
    joined.push({ x: t.tolerance, conservation: h.conservation, entropy: h.entropy });
  }

  return { name: "Jones et al.|B2AR Mutational Tolerance", data: joined };
}

async function prepareData_MC4R_Sensitivity() {

    readTSV(MC4R_sensitivity_tsv_path),
    readTSV(CONSOLIDATED_mapping_tsv_path),
    readTSV(MC4R_scatter_hrh2_path)
  ]);

  const sensRows = sens.map(r => ({
    mc4r_pos: firstInt(r.pos),
    sens_score: toNum(r.sens_score)
  })).filter(r => r.mc4r_pos != null && r.sens_score != null);

  const mapRows = map.map(r => ({
    hrh2_int: firstInt(r.HRH2_resNum),
    mc4r_int: firstInt(r.MC4R_resNum)
  })).filter(r => r.hrh2_int && r.mc4r_int);

  const hrh2Rows = hrh2.map(r => ({
    hrh2_int: firstInt(r.HRH2_res_no),
    entropy: toNum(r.entropy),
    conservation: toNum(r.conservation)
  })).filter(r => r.hrh2_int && r.entropy != null && r.conservation != null);

  const merged = [];
  for (const s of sensRows) {
    const m = mapRows.find(k => k.mc4r_int === s.mc4r_pos);
    if (!m) continue;
    const h = hrh2Rows.find(h => h.hrh2_int === m.hrh2_int);
    if (!h) continue;
    merged.push({ x: s.sens_score, conservation: h.conservation, entropy: h.entropy });
  }

  return { name: "C. J. Howard et al.|MC4R Mutational Sensitivity", data: merged };
}

async function prepareData_OPSD_SurfaceExpression() {
  const [surfExp, map, hrh2] = await Promise.all([
    readTSV(OPSD_surface_expression_path),
    readTSV(CONSOLIDATED_mapping_tsv_path),
    readTSV(OPSD_scatter_hrh2_path)
  ]);

  const posCol = Object.keys(surfExp[0] || {}).find(k => k.toLowerCase() === "pos") || "pos";
  const scoreCol = Object.keys(surfExp[0] || {}).find(k => k.toLowerCase() === "score") || "score";

/* ========================= Summary Table Functions ========================= */
function formatCorrelation(r, p, n) {
  let pText;
  if (p < 1e-15 || p === 0) {
    pText = "p < 1e-15";
  } else if (p < 0.001) {
    pText = `p = ${p.toExponential(2)}`;
  } else {
    pText = `p = ${p.toFixed(3)}`;
  }
  const rText = `r = ${r.toFixed(3)}`;
  
  // Color code by significance
  let className = "sig-low";
  if (p < 0.001) className = "sig-high";
  else if (p < 0.05) className = "sig-medium";
  
  return `<span class="${className}">${rText}, ${pText}</span>`;
}

function populateSummaryTable(datasets) {
  const tableBody = document.getElementById("tableBody");
  tableBody.innerHTML = "";
  
  // Store correlation values for averaging
  const correlations = [];
  
  datasets.forEach((dataset, index) => {
    // Conservation correlation
    const conservationData = dataset.data.map(d => ({ x: d.x, y: d.conservation }));
    const xValsCons = conservationData.map(d => d.x);
    const yValsCons = conservationData.map(d => d.y);
    const { r: rCons, p: pCons } = pearsonCorrelation(xValsCons, yValsCons);
    
    // Entropy correlation (Conservation only)
    const entropyData = dataset.data
      .filter(d => d.conservation >= CONS_THR)
      .map(d => ({ x: d.x, y: d.entropy }));
    const xValsEnt = entropyData.map(d => d.x);
    const yValsEnt = entropyData.map(d => d.y);
    const { r: rEnt, p: pEnt } = pearsonCorrelation(xValsEnt, yValsEnt);
    
    // Store correlation values
    correlations.push({ rCons, rEnt, pCons, pEnt });
    
    // Format dataset name for table (handle multi-line titles)
    const displayName = dataset.name.includes("|") 
      ? dataset.name.split("|").map((part, i) => i === 0 ? `<em>${part}</em>` : part).join(" ")
      : dataset.name;
    
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><strong>${displayName}</strong></td>
      <td>${formatCorrelation(rCons, pCons)}</td>
      <td>${conservationData.length}</td>
      <td>${formatCorrelation(rEnt, pEnt)}</td>
      <td>${entropyData.length}</td>
    `;
    tableBody.appendChild(row);
    
    // After the first 6 experiments, add average row
    if (index === 5) {
      const avgRCons = correlations.slice(0, 6).reduce((sum, c) => sum + Math.abs(c.rCons), 0) / 6;
      const avgREnt = correlations.slice(0, 6).reduce((sum, c) => sum + Math.abs(c.rEnt), 0) / 6;
      
      const avgRow = document.createElement("tr");
      avgRow.style.backgroundColor = "#e8e8e8";
      avgRow.style.fontWeight = "600";
      avgRow.innerHTML = `
        <td><strong>Average (First 6)</strong></td>
        <td><span style="color: #000;">|r| = ${avgRCons.toFixed(3)}</span></td>
        <td>—</td>
        <td><span style="color: #000;">|r| = ${avgREnt.toFixed(3)}</span></td>
        <td>—</td>
      `;
      tableBody.appendChild(avgRow);
    }
  });
}

/* ========================= Main Render ========================= */
async function renderAllPanels() {
  try {
    // Prepare all datasets
    const allDatasets = await Promise.all([
      prepareData_ADRB2_Tolerance(),
      prepareData_MC4R_Sensitivity(),
      prepareData_GPR68_pH55(),
      prepareData_V2R_Expression(),
      prepareData_ADRB2_Emax(),
      prepareData_ADRB2_BetaArrestin(),
      prepareData_Combined_Intolerance(),
      prepareData_ClinVar(),
      prepareData_EC100_Potency_Normalized(),
      prepareData_EC100_Efficacy_Normalized()
    ]);

    // Populate summary table
    populateSummaryTable(allDatasets);

    const numDatasets = allDatasets.length;
  const numPanels = numDatasets * 2; // two correlation panels per dataset
  const NUM_COLS = 3; // 3 plots per row
  const numRows = Math.ceil(numPanels / NUM_COLS);
  const TOTAL_WIDTH = NUM_COLS * PANEL_WIDTH + (NUM_COLS - 1) * PANEL_SPACING_X; // 3 panels per row
  const TOTAL_HEIGHT = numRows * (PANEL_HEIGHT + PANEL_SPACING_Y);

  // Set the table width to match 3 plots wide
  const TABLE_WIDTH = TOTAL_WIDTH;
    document.getElementById("summaryTable").style.width = TABLE_WIDTH + "px";

    const svg = d3.select("#svgContainer")
      .append("svg")
      .attr("width", TOTAL_WIDTH)
      .attr("height", TOTAL_HEIGHT)
      .attr("id", "mainSvg");

    // Draw panels for each dataset in a 3-column layout (3 plots per row)
    let panelCounter = 0;
    let firstHighConsTitleUsed = false; // first time we show the full "Conservation ≥ 75.27" wording
    allDatasets.forEach((dataset, idx) => {
      // Extract metric name (without author) for axis labels
      let metricName = dataset.name.includes("|") 
        ? dataset.name.split("|")[1].trim() 
        : dataset.name;
      
      // Remove receptor name prefixes from x-axis label
      metricName = metricName.replace(/^(B2AR|V2R|MC4R|GPR68|OPSD)\s+/i, "");

      // For surface expression datasets, label x-axis as Mutational Tolerance
      if (dataset.name === "Wan et al.|Surface Expression" ||
          dataset.name === "Mighell et al.|V2R Surface Expression") {
        metricName = "Mutational Tolerance";
      }

      // Left panel: Conservation vs. Metric (all data)
      const conservationData = dataset.data.map(d => ({ x: d.x, y: d.conservation }));

      // Position for conservation panel based on panelCounter
      let rowIndex = Math.floor(panelCounter / NUM_COLS);
      let colIndex = panelCounter % NUM_COLS;
      let xPos = colIndex * (PANEL_WIDTH + PANEL_SPACING_X);
      let yPos = rowIndex * (PANEL_HEIGHT + PANEL_SPACING_Y);

      drawCorrelationPanel({
        svg: svg,
        x: xPos,
        y: yPos,
        title: dataset.name,
        data: conservationData,
        xLabel: metricName,
        yLabel: "Family-Wide Conservation",
        letter: String.fromCharCode(98 + panelCounter) // start from 'b' since 'a' is table
      });
      panelCounter++;

      // Right panel: Entropy vs. Metric (high conservation only)
      const entropyData = dataset.data
        .filter(d => d.conservation >= CONS_THR)
        .map(d => ({ x: d.x, y: d.entropy }));

      rowIndex = Math.floor(panelCounter / NUM_COLS);
      colIndex = panelCounter % NUM_COLS;
      xPos = colIndex * (PANEL_WIDTH + PANEL_SPACING_X);
      yPos = rowIndex * (PANEL_HEIGHT + PANEL_SPACING_Y);

      // Use full wording for the first high-conservation panel, then shorten to "Cons. ≥ 75"
      let highConsTitle;
      if (!firstHighConsTitleUsed) {
        highConsTitle = `${dataset.name} (Conservation ≥ ${CONS_THR})`;
        firstHighConsTitleUsed = true;
      } else {
        highConsTitle = `${dataset.name} (Cons. ≥ 75)`;
      }

      drawCorrelationPanel({
        svg: svg,
        x: xPos,
        y: yPos,
        title: highConsTitle,
        data: entropyData,
        xLabel: metricName,
        yLabel: "Family-Wide Entropy",
        letter: String.fromCharCode(98 + panelCounter)
      });
      panelCounter++;
    });

    console.log("All correlation panels rendered successfully!");
  } catch (e) {
    console.error("Error rendering panels:", e);
    alert("Error rendering plots. See console for details.");
  }
}

/* ========================= SVG Download ========================= */
function downloadSVG() {
  const svgElement = document.getElementById("mainSvg");
  const serializer = new XMLSerializer();
  let svgString = serializer.serializeToString(svgElement);

  const styles = `<style type="text/css">
          .axis-label { font-size: 16px; font-family: Arial, sans-serif; }
          .panel-title { font-size: 18px; font-weight: 600; font-family: Arial, sans-serif; }
          .axis line, .axis path { stroke: #333; }
          .axis text { font-size: 14px; fill: #333; font-family: Arial, sans-serif; }
          .correlation-text { font-size: 14px; font-weight: 600; fill: #000000; font-family: Arial, sans-serif; }
          .regression-line { stroke: #000000; stroke-width: 2; fill: none; }
          .stats-box { fill: white; stroke: #333; stroke-width: 1; opacity: 0.9; }
        </style>`;

  if (svgString.includes('<defs>')) {
    svgString = svgString.replace('<defs>', '<defs>' + styles);
  } else {
    svgString = svgString.replace(/(<svg[^>]*>)/, '$1<defs>' + styles + '</defs>');
  }

  svgString = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgString;

  const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
