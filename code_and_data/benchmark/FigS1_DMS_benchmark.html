      padding: 8px 12px;

      transition: opacity 0.2s;

      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .tooltip-row { margin: 2px 0; }
    .tooltip-label { font-weight: 600; color: #ffd700; }
    .legend-item { cursor: default; }
    .legend-text { font-size: 14px; }
  </style>
</head>
<body>
  <h2>Deep Mutational Scanning Studies</h2>

  <div class="controls">
    <button class="btn" onclick="downloadSVG()">Download SVG</button>
    <button class="btn" onclick="downloadPNG()">Download PNG</button>
  </div>

  <div id="svgContainer"></div>
  <div class="tooltip" id="tooltip"></div>

<script>
/* ========================= CONFIG ========================= */
const CONS_THR = 75.27, ENT_THR1 = 1.78, ENT_THR2 = 2.63;
const CLASSA_LABELS = "data/HRH2_entropy_conservation.txt";

// Panel configurations
const CONSOLIDATED_mapping_tsv_path = "Consolidated_GPCR_mapping.tsv"; // Single consolidated mapping file

const ADRB2_scatter_data_path  = CLASSA_LABELS;
const ADRB2_tolerance_xls_path = "data/ADRB2_tolerance_data_JonesEtAl.xls";
const ADRB2_tol_condition_value = 0.625;
const ADRB2_pe_tsv_path = "data/ADRB2_potency_efficacy.tsv";

const MC4R_sensitivity_tsv_path = "data/MC4R_sensitivity.tsv";
const MC4R_scatter_hrh2_path    = CLASSA_LABELS;

const GPR68_normalized_tsv_path = "data/GPR68_normalized_activation_scores.tsv";
const GPR68_scatter_hrh2_path   = CLASSA_LABELS;

const V2R_expression_path = "data/V2R_expression.tsv";
const V2R_scatter_hrh2_path = CLASSA_LABELS;

const ADRB2_emax_tsv_path = "data/ADRB2_Emax_Gprotein.tsv";
const ADRB2_emax_scatter_hrh2_path = CLASSA_LABELS;

const ADRB2_barr_tsv_path = "data/ADRB2_BetaArrestin_EC100.tsv";
const ADRB2_barr_scatter_hrh2_path = CLASSA_LABELS;

const ADRB2_ec100_alanine_path = "data/EC100_alanine_scanning.txt";
const ADRB2_ec100_scatter_hrh2_path = CLASSA_LABELS;

// Normalization helper function (0-1 scaling)
function normalizeToZeroOne(values) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min;
  if (range === 0) return values.map(() => 0.5);
  return values.map(v => (v - min) / range);
}

/* ========================= Colors & Layout ========================= */
const COLOR_GREY="#D3D3D3", COLOR_RED="#D62728", COLOR_ORNG="#FFA500", 
      COLOR_BLUE="#4E79A7", COLOR_CHAR="#333333";

// Layout for up to 4 rows × 3 columns (10 panels currently used, 3 per row max)
const PANEL_WIDTH = 480, PANEL_HEIGHT = 360;
const PANEL_MARGIN = {top: 50, right: 20, bottom: 50, left: 60};
const PANEL_SPACING_X = 80, PANEL_SPACING_Y = 50;

const TOTAL_WIDTH = 3 * PANEL_WIDTH + 2 * PANEL_SPACING_X + PANEL_MARGIN.left + PANEL_MARGIN.right;
const TOTAL_HEIGHT = 4 * PANEL_HEIGHT + 3 * PANEL_SPACING_Y + PANEL_MARGIN.top + PANEL_MARGIN.bottom;

/* ========================= Utilities ========================= */
function firstInt(s){ const m=String(s??"").match(/\d+/); return m?parseInt(m[0],10):null; }
function toNum(v){ const x=Number(v); return Number.isFinite(x)?x:null; }
function uniq(arr){ return Array.from(new Set(arr)); }

function readTSV(path){
  return new Promise((resolve, reject) => {
    Papa.parse(path, { delimiter:"\t", header:true, download:true,
      complete: res => resolve(res.data.filter(r => Object.keys(r).length>0)),
      error: err => reject(err)
    });
  });
}

async function readXLSX_firstSheet(path){
  const resp = await fetch(path); const buf = await resp.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"}); const sh = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(sh, { raw:true, defval:null });
}

/* ========================= Statistical Functions ========================= */
// Mann-Whitney U test (Wilcoxon rank-sum test)
function mannWhitneyU(array1, array2) {
  const n1 = array1.length;
  const n2 = array2.length;
  
  // Combine and rank
  const combined = array1.map((v, i) => ({ value: v, group: 1 }))
    .concat(array2.map((v, i) => ({ value: v, group: 2 })));
  
  combined.sort((a, b) => a.value - b.value);
  
  // Assign ranks (handle ties with average rank)
  let rank = 1;
  for (let i = 0; i < combined.length; i++) {
    let j = i;
    while (j < combined.length - 1 && combined[j].value === combined[j + 1].value) {
      j++;
    }
    const avgRank = (rank + (rank + j - i)) / 2;
    for (let k = i; k <= j; k++) {
      combined[k].rank = avgRank;
    }
    rank += (j - i + 1);
    i = j;
  }
  
  // Calculate U statistic
  const R1 = combined.filter(d => d.group === 1).reduce((sum, d) => sum + d.rank, 0);
  const U1 = R1 - (n1 * (n1 + 1)) / 2;
  const U2 = n1 * n2 - U1;
  const U = Math.min(U1, U2);
  
  // Calculate z-score and p-value (normal approximation)
  const meanU = (n1 * n2) / 2;
  const stdU = Math.sqrt((n1 * n2 * (n1 + n2 + 1)) / 12);
  const z = (U - meanU) / stdU;
  
  // Two-tailed p-value
  const p = 2 * (1 - jStat.normal.cdf(Math.abs(z), 0, 1));
  
  return { U, p, z };
}

/* ========================= Main Drawing Function ========================= */
let globalGpcrdbMap = new Map(); // hrh2_int -> gpcrdb_string

function drawPanel({svg, x, y, title, data, colorSpec, xDomain, yDomain}) {
  const g = svg.append("g")
    .attr("transform", `translate(${x}, ${y})`);

  // Scales
  const xScale = d3.scaleLinear()
    .domain(xDomain || [0, d3.max(data, d => d.entropy) * 1.05])
    .range([PANEL_MARGIN.left, PANEL_WIDTH - PANEL_MARGIN.right]);

  const yScale = d3.scaleLinear()
    .domain(yDomain || [0, 100])
    .range([PANEL_HEIGHT - PANEL_MARGIN.bottom, PANEL_MARGIN.top]);

  // Axes
  const xAxis = d3.axisBottom(xScale).ticks(5);
  const yAxis = d3.axisLeft(yScale).ticks(5).tickValues([0, 20, 40, 60, 80, 100]);

  // Threshold lines
  g.append("line")
    .attr("class", "threshold-line")
    .attr("x1", xScale(ENT_THR1))
    .attr("x2", xScale(ENT_THR1))
    .attr("y1", PANEL_MARGIN.top)
    .attr("y2", PANEL_HEIGHT - PANEL_MARGIN.bottom);

  g.append("line")
    .attr("class", "threshold-line")
    .attr("x1", xScale(ENT_THR2))
    .attr("x2", xScale(ENT_THR2))
    .attr("y1", PANEL_MARGIN.top)
    .attr("y2", PANEL_HEIGHT - PANEL_MARGIN.bottom);

  g.append("line")
    .attr("class", "threshold-line")
    .attr("x1", PANEL_MARGIN.left)
    .attr("x2", PANEL_WIDTH - PANEL_MARGIN.right)
    .attr("y1", yScale(CONS_THR))
    .attr("y2", yScale(CONS_THR));

  // Axes
  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0, ${PANEL_HEIGHT - PANEL_MARGIN.bottom})`)
    .call(xAxis);

  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${PANEL_MARGIN.left}, 0)`)
    .call(yAxis);

  // Axis labels
  g.append("text")
    .attr("class", "axis-label")
    .attr("text-anchor", "middle")
    .attr("x", (PANEL_MARGIN.left + PANEL_WIDTH - PANEL_MARGIN.right) / 2)
    .attr("y", PANEL_HEIGHT - 5)
    .text("Family-Wide Entropy");

  g.append("text")
    .attr("class", "axis-label")
    .attr("text-anchor", "middle")
    .attr("transform", `translate(15, ${(PANEL_MARGIN.top + PANEL_HEIGHT - PANEL_MARGIN.bottom) / 2}) rotate(-90)`)
    .text("Family-Wide Conservation");

  // Extract letter label (a., b., etc.) and title
  const letterMatch = title.match(/^([a-z]\.)\s*(.+)$/);
  const letter = letterMatch ? letterMatch[1] : "";
  const titleText = letterMatch ? letterMatch[2] : title;
  
  // Letter label at top left
  if (letter) {
    g.append("text")
      .attr("class", "panel-title")
      .attr("x", 5)
      .attr("y", 20)
      .attr("font-weight", "700")
      .text(letter);
  }
  
  // Centered title above plot area (support multi-line with | separator)
  const titleLines = titleText.split("|");
  const centerX = (PANEL_MARGIN.left + PANEL_WIDTH - PANEL_MARGIN.right) / 2;
  
  if (titleLines.length > 1) {
    titleLines.forEach((line, i) => {
      g.append("text")
        .attr("class", "panel-title")
        .attr("text-anchor", "middle")
        .attr("x", centerX)
        .attr("y", 15 + i * 16)
        .text(line.trim());
    });
  } else {
    g.append("text")
      .attr("class", "panel-title")
      .attr("text-anchor", "middle")
      .attr("x", centerX)
      .attr("y", 20)
      .text(titleText);
  }

  // Tooltip
  const tooltip = d3.select("#tooltip");

  if (colorSpec.type === "categorical") {
    // Categorical coloring
    const categories = colorSpec.order || uniq(data.map(d => d.category));
    
    const sortedCategories = [...categories].sort((a, b) => {
      if (a === "other") return -1;
      if (b === "other") return 1;
      return 0;
    });
    
    sortedCategories.forEach(cat => {
      const catData = data.filter(d => d.category === cat);
      
      g.selectAll(`.circle-${cat.replace(/[^a-zA-Z0-9]/g, '_')}`)
        .data(catData)
        .enter().append("circle")
        .attr("cx", d => xScale(d.entropy))
        .attr("cy", d => yScale(d.conservation))
        .attr("r", 4)
        .attr("fill", colorSpec.map[cat] || COLOR_GREY)
        .attr("opacity", 0.7)
        .attr("stroke", "none")
        .on("mouseover", function(event, d) {
          d3.select(this).attr("r", 6).attr("opacity", 1).attr("stroke", "#000").attr("stroke-width", 1.5);
          const gpcrdb = d.hrh2_int ? (globalGpcrdbMap.get(d.hrh2_int) || "N/A") : "N/A";
          tooltip.style("opacity", 1)
            .html(`
              <div class="tooltip-row"><span class="tooltip-label">Conservation:</span> ${d.conservation.toFixed(2)}</div>
              <div class="tooltip-row"><span class="tooltip-label">Entropy:</span> ${d.entropy.toFixed(2)}</div>
              <div class="tooltip-row"><span class="tooltip-label">HRH2 GPCRdb:</span> ${gpcrdb}</div>
              ${d.category ? `<div class="tooltip-row"><span class="tooltip-label">Category:</span> ${d.category}</div>` : ''}
            `);
        })
        .on("mousemove", function(event) {
          tooltip.style("left", (event.pageX + 15) + "px")
            .style("top", (event.pageY - 15) + "px");
        })
        .on("mouseout", function() {
          d3.select(this).attr("r", 4).attr("opacity", 0.7).attr("stroke", "none");
          tooltip.style("opacity", 0);
        });
    });

    // Legend for categorical
    const legendCategories = categories.filter(cat => cat !== "other");
    const legendX = PANEL_MARGIN.left + 15;
    const legendY = (PANEL_MARGIN.top + PANEL_HEIGHT - PANEL_MARGIN.bottom) / 2 - (legendCategories.length * 22) / 2;
    
    legendCategories.forEach((cat, i) => {
      const displayLabel = colorSpec.labels && colorSpec.labels[cat] ? colorSpec.labels[cat] : cat;
      
      g.append("circle")
        .attr("cx", legendX)
        .attr("cy", legendY + i * 22)
        .attr("r", 5)
        .attr("fill", colorSpec.map[cat] || COLOR_GREY)
        .attr("class", "legend-item");

      g.append("text")
        .attr("x", legendX + 12)
        .attr("y", legendY + i * 22 + 5)
        .attr("class", "legend-text")
        .text(displayLabel);
    });

  } else {
    // Continuous coloring
    const colorScale = d3.scaleLinear()
      .domain(d3.extent(data, d => d.colorValue))
      .range([colorSpec.lowColor, colorSpec.highColor])
      .interpolate(d3.interpolateRgb);

    if (colorSpec.midColor) {
      const [min, max] = d3.extent(data, d => d.colorValue);
      let midpoint = (min + max) / 2;
      
      if (colorSpec.centerAtZero) {
        midpoint = 0;
        if (colorSpec.lowMidColor && colorSpec.highMidColor) {
          const greyExtent = colorSpec.greyExtent || 0.3;
          const lowMid = min * greyExtent;
          const highMid = max * greyExtent;
          
          colorScale.domain([min, lowMid, 0, highMid, max])
            .range([colorSpec.lowColor, colorSpec.lowMidColor, colorSpec.midColor, colorSpec.highMidColor, colorSpec.highColor]);
        } else {
          colorScale.domain([min, 0, max])
            .range([colorSpec.lowColor, colorSpec.midColor, colorSpec.highColor]);
        }
      } else {
        if (colorSpec.midPosition != null) {
          midpoint = min + (max - min) * colorSpec.midPosition;
        }
        colorScale.domain([min, midpoint, max])
          .range([colorSpec.lowColor, colorSpec.midColor, colorSpec.highColor]);
      }
    }

    g.selectAll(".data-circle")
      .data(data)
      .enter().append("circle")
      .attr("cx", d => xScale(d.entropy))
      .attr("cy", d => yScale(d.conservation))
      .attr("r", 4)
      .attr("fill", d => colorScale(d.colorValue))
      .attr("opacity", 0.7)
      .attr("stroke", "none")
      .on("mouseover", function(event, d) {
        d3.select(this).attr("r", 6).attr("opacity", 1).attr("stroke", "#000").attr("stroke-width", 1.5);
        const gpcrdb = d.hrh2_int ? (globalGpcrdbMap.get(d.hrh2_int) || "N/A") : "N/A";
        tooltip.style("opacity", 1)
          .html(`
            <div class="tooltip-row"><span class="tooltip-label">Conservation:</span> ${d.conservation.toFixed(2)}</div>
            <div class="tooltip-row"><span class="tooltip-label">Entropy:</span> ${d.entropy.toFixed(2)}</div>
            <div class="tooltip-row"><span class="tooltip-label">HRH2 GPCRdb:</span> ${gpcrdb}</div>
            <div class="tooltip-row"><span class="tooltip-label">${colorSpec.colorbarTitle}:</span> ${d.colorValue.toFixed(3)}</div>
          `);
      })
      .on("mousemove", function(event) {
        tooltip.style("left", (event.pageX + 15) + "px")
          .style("top", (event.pageY - 15) + "px");
      })
      .on("mouseout", function() {
        d3.select(this).attr("r", 4).attr("opacity", 0.7).attr("stroke", "none");
        tooltip.style("opacity", 0);
      });

    // Color bar for continuous
    const colorbarHeight = 150;
    const colorbarWidth = 15;
    const colorbarX = PANEL_WIDTH - PANEL_MARGIN.right + 10;
    const colorbarY = PANEL_MARGIN.top + 20;

    const defs = svg.append("defs");
    const gradient = defs.append("linearGradient")
      .attr("id", `gradient-${title.replace(/[^a-zA-Z0-9]/g, '_')}`)
      .attr("x1", "0%")
      .attr("y1", "100%")
      .attr("x2", "0%")
      .attr("y2", "0%");

    let [minVal, maxVal] = d3.extent(data, d => d.colorValue);
    
    if (colorSpec.midColor) {
      let midOffset = "50%";
      
      if (colorSpec.centerAtZero) {
        const range = maxVal - minVal;
        const zeroPosition = range > 0 ? (0 - minVal) / range : 0.5;
        midOffset = (zeroPosition * 100).toFixed(1) + "%";
        
        if (colorSpec.lowMidColor && colorSpec.highMidColor) {
          const greyExtent = colorSpec.greyExtent || 0.3;
          const lowMidVal = minVal * greyExtent;
          const highMidVal = maxVal * greyExtent;
          
          const lowMidPosition = (lowMidVal - minVal) / range;
          const highMidPosition = (highMidVal - minVal) / range;
          
          const lowMidOffset = (lowMidPosition * 100).toFixed(1) + "%";
          const highMidOffset = (highMidPosition * 100).toFixed(1) + "%";
          
          gradient.append("stop").attr("offset", "0%").attr("stop-color", colorSpec.lowColor);
          gradient.append("stop").attr("offset", lowMidOffset).attr("stop-color", colorSpec.lowMidColor);
          gradient.append("stop").attr("offset", midOffset).attr("stop-color", colorSpec.midColor);
          gradient.append("stop").attr("offset", highMidOffset).attr("stop-color", colorSpec.highMidColor);
          gradient.append("stop").attr("offset", "100%").attr("stop-color", colorSpec.highColor);
        } else {
          gradient.append("stop").attr("offset", "0%").attr("stop-color", colorSpec.lowColor);
          gradient.append("stop").attr("offset", midOffset).attr("stop-color", colorSpec.midColor);
          gradient.append("stop").attr("offset", "100%").attr("stop-color", colorSpec.highColor);
        }
      } else {
        if (colorSpec.midPosition != null) {
          midOffset = (colorSpec.midPosition * 100).toFixed(1) + "%";
        }
        gradient.append("stop").attr("offset", "0%").attr("stop-color", colorSpec.lowColor);
        gradient.append("stop").attr("offset", midOffset).attr("stop-color", colorSpec.midColor);
        gradient.append("stop").attr("offset", "100%").attr("stop-color", colorSpec.highColor);
      }
    } else {
      gradient.append("stop").attr("offset", "0%").attr("stop-color", colorSpec.lowColor);
      gradient.append("stop").attr("offset", "100%").attr("stop-color", colorSpec.highColor);
    }

    g.append("rect")
      .attr("x", colorbarX)
      .attr("y", colorbarY)
      .attr("width", colorbarWidth)
      .attr("height", colorbarHeight)
      .style("fill", `url(#gradient-${title.replace(/[^a-zA-Z0-9]/g, '_')})`);

    g.append("text")
      .attr("x", colorbarX + colorbarWidth + 5)
      .attr("y", colorbarY + 5)
      .attr("class", "legend-text")
      .text(maxVal.toFixed(2));

    g.append("text")
      .attr("x", colorbarX + colorbarWidth + 5)
      .attr("y", colorbarY + colorbarHeight + 5)
      .attr("class", "legend-text")
      .text(minVal.toFixed(2));

    if (colorSpec.centerAtZero && colorSpec.midColor) {
      const range = maxVal - minVal;
      const zeroPosition = range > 0 ? (0 - minVal) / range : 0.5;
      const zeroY = colorbarY + colorbarHeight * (1 - zeroPosition);
      
      g.append("text")
        .attr("x", colorbarX + colorbarWidth + 5)
        .attr("y", zeroY + 5)
        .attr("class", "legend-text")
        .text("0");
    }

    const titleX = colorbarX + colorbarWidth + 20;
    const titleY = colorbarY + colorbarHeight / 2;
    g.append("text")
      .attr("x", titleX)
      .attr("y", titleY)
      .attr("class", "legend-text")
      .attr("text-anchor", "middle")
      .attr("transform", `rotate(-90, ${titleX}, ${titleY})`)
      .text(colorSpec.colorbarTitle);
  }
}

/* ========================= Boxplot Drawing Function ========================= */
function drawBoxplot({svg, x, y, title, data, yLabel}) {
  const g = svg.append("g")
    .attr("transform", `translate(${x}, ${y})`);

  // Scales
  const xScale = d3.scaleBand()
    .domain(["Conservation", "Entropy"])
    .range([PANEL_MARGIN.left, PANEL_WIDTH - PANEL_MARGIN.right])
    .padding(0.3);

  const yScale = d3.scaleLinear()
    .domain([0, 1])
    .range([PANEL_HEIGHT - PANEL_MARGIN.bottom, PANEL_MARGIN.top]);

  // Axes
  const xAxis = d3.axisBottom(xScale);
  const yAxis = d3.axisLeft(yScale).ticks(5);

  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0, ${PANEL_HEIGHT - PANEL_MARGIN.bottom})`)
    .call(xAxis);

  g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(${PANEL_MARGIN.left}, 0)`)
    .call(yAxis);

  // Axis labels
  g.append("text")
    .attr("class", "axis-label")
    .attr("text-anchor", "middle")
    .attr("x", (PANEL_MARGIN.left + PANEL_WIDTH - PANEL_MARGIN.right) / 2)
    .attr("y", PANEL_HEIGHT - 5)
    .text("Metric Type");

  g.append("text")
    .attr("class", "axis-label")
    .attr("text-anchor", "middle")
    .attr("transform", `translate(15, ${(PANEL_MARGIN.top + PANEL_HEIGHT - PANEL_MARGIN.bottom) / 2}) rotate(-90)`)
    .text(yLabel);

  // Extract letter label and title
  const letterMatch = title.match(/^([a-z]\.)\s*(.+)$/);
  const letter = letterMatch ? letterMatch[1] : "";
  const titleText = letterMatch ? letterMatch[2] : title;
  
  if (letter) {
    g.append("text")
      .attr("class", "panel-title")
      .attr("x", 5)
      .attr("y", 20)
      .attr("font-weight", "700")
      .text(letter);
  }
  
  const titleLines = titleText.split("|");
  const centerX = (PANEL_MARGIN.left + PANEL_WIDTH - PANEL_MARGIN.right) / 2;
  
  if (titleLines.length > 1) {
    titleLines.forEach((line, i) => {
      g.append("text")
        .attr("class", "panel-title")
        .attr("text-anchor", "middle")
        .attr("x", centerX)
        .attr("y", 15 + i * 16)
        .text(line.trim());
    });
  } else {
    g.append("text")
      .attr("class", "panel-title")
      .attr("text-anchor", "middle")
      .attr("x", centerX)
      .attr("y", 20)
      .text(titleText);
  }

  // Draw two boxes per group (Potency and Efficacy)
  const groups = ["Conservation", "Entropy"];
  const subgroups = ["Potency", "Efficacy"];
  const colors = { "Potency": "#7caec4", "Efficacy": "#d4a5a5" };
  
  groups.forEach(groupName => {
    const xCenter = xScale(groupName) + xScale.bandwidth() / 2;
    const groupWidth = xScale.bandwidth();
    const boxWidth = groupWidth * 0.35;
    const offset = boxWidth * 0.55;
    
    subgroups.forEach((subgroup, idx) => {
      const values = data[groupName][subgroup].sort((a, b) => a - b);
      if (values.length === 0) return;
      
      const q1 = d3.quantile(values, 0.25);
      const median = d3.quantile(values, 0.5);
      const q3 = d3.quantile(values, 0.75);
      const iqr = q3 - q1;
      const min = Math.max(d3.min(values), q1 - 1.5 * iqr);
      const max = Math.min(d3.max(values), q3 + 1.5 * iqr);
      
      const xPos = xCenter + (idx === 0 ? -offset : offset);
      
      // Draw box
      g.append("rect")
        .attr("x", xPos - boxWidth / 2)
        .attr("y", yScale(q3))
        .attr("width", boxWidth)
        .attr("height", yScale(q1) - yScale(q3))
        .attr("fill", colors[subgroup])
        .attr("fill-opacity", 0.6)
        .attr("stroke", "#333")
        .attr("stroke-width", 1.5);
      
      // Draw median line
      g.append("line")
        .attr("x1", xPos - boxWidth / 2)
        .attr("x2", xPos + boxWidth / 2)
        .attr("y1", yScale(median))
        .attr("y2", yScale(median))
        .attr("stroke", "#333")
        .attr("stroke-width", 2);
      
      // Draw whiskers
      g.append("line")
        .attr("x1", xPos)
        .attr("x2", xPos)
        .attr("y1", yScale(q3))
        .attr("y2", yScale(max))
        .attr("stroke", "#333")
        .attr("stroke-width", 1.5);
      
      g.append("line")
        .attr("x1", xPos)
        .attr("x2", xPos)
        .attr("y1", yScale(q1))
        .attr("y2", yScale(min))
        .attr("stroke", "#333")
        .attr("stroke-width", 1.5);
      
      // Draw whisker caps
      g.append("line")
        .attr("x1", xPos - boxWidth / 4)
        .attr("x2", xPos + boxWidth / 4)
        .attr("y1", yScale(max))
        .attr("y2", yScale(max))
        .attr("stroke", "#333")
        .attr("stroke-width", 1.5);
      
      g.append("line")
        .attr("x1", xPos - boxWidth / 4)
        .attr("x2", xPos + boxWidth / 4)
        .attr("y1", yScale(min))
        .attr("y2", yScale(min))
        .attr("stroke", "#333")
        .attr("stroke-width", 1.5);
      
      // Draw individual points with jitter
      const jitterWidth = boxWidth * 0.25;
      values.forEach(val => {
        const jitter = (Math.random() - 0.5) * jitterWidth;
        g.append("circle")
          .attr("cx", xPos + jitter)
          .attr("cy", yScale(val))
          .attr("r", 2)
          .attr("fill", colors[subgroup])
          .attr("opacity", 0.4)
          .attr("stroke", "none");
      });
    });
  });

  // Legend
  const legendX = PANEL_MARGIN.left + 15;
  const legendY = PANEL_HEIGHT - PANEL_MARGIN.bottom - 50;
  
  subgroups.forEach((subgroup, i) => {
    g.append("rect")
      .attr("x", legendX)
      .attr("y", legendY + i * 20)
      .attr("width", 12)
      .attr("height", 12)
      .attr("fill", colors[subgroup])
      .attr("fill-opacity", 0.6)
      .attr("stroke", "#333");
    
    g.append("text")
      .attr("x", legendX + 18)
      .attr("y", legendY + i * 20 + 10)
      .attr("class", "legend-text")
      .style("font-size", "12px")
      .text(subgroup);
  });

  // Calculate p-values for each metric
  const pCons = mannWhitneyU(data.Conservation.Potency, data.Conservation.Efficacy).p;
  const pEnt = mannWhitneyU(data.Entropy.Potency, data.Entropy.Efficacy).p;
  
  // Display p-values
  const formatP = (p) => p < 0.001 ? "p < 0.001" : `p = ${p.toFixed(3)}`;
  
  g.append("text")
    .attr("class", "correlation-text")
    .attr("x", xScale("Conservation") + xScale.bandwidth() / 2)
    .attr("y", PANEL_MARGIN.top + 35)
    .attr("text-anchor", "middle")
    .style("font-size", "11px")
    .text(formatP(pCons));
  
  g.append("text")
    .attr("class", "correlation-text")
    .attr("x", xScale("Entropy") + xScale.bandwidth() / 2)
    .attr("y", PANEL_MARGIN.top + 35)
    .attr("text-anchor", "middle")
    .style("font-size", "11px")
    .text(formatP(pEnt));
}

// (d) B2AR Tolerance
async function preparePanel_d() {
  const [tol, map, hrh2] = await Promise.all([
    readXLSX_firstSheet(ADRB2_tolerance_xls_path),
    readTSV(CONSOLIDATED_mapping_tsv_path),
    readTSV(ADRB2_scatter_data_path)
  ]);

  const tolRows = tol.filter(r => Math.abs(Number(r.Condition) - ADRB2_tol_condition_value) < 1e-6)
    .map(r => ({
      adrb2_pos: toNum(r.Pos),
      tolerance: toNum(r.Tolerance)
    }))
    .filter(r => r.adrb2_pos != null && r.tolerance != null);

  const mapRows = map.map(r => ({
    hrh2_int: firstInt(r.HRH2_resNum),
    adrb2_int: firstInt(r.ADRB2_resNum)
  })).filter(r => r.hrh2_int && r.adrb2_int);

  const hrh2Rows = hrh2.map(r => ({
    hrh2_int: firstInt(r.HRH2_res_no),
    entropy: toNum(r.entropy),
    conservation: toNum(r.conservation)
  })).filter(r => r.hrh2_int && r.entropy != null && r.conservation != null);

  const joined = [];
  for (const t of tolRows) {
    const m = mapRows.find(k => k.adrb2_int === t.adrb2_pos);
    if (!m) continue;
    
    const h = hrh2Rows.find(h => h.hrh2_int === m.hrh2_int);
    if (!h) continue;
    
    joined.push({ 
      entropy: h.entropy, 
      conservation: h.conservation, 
      colorValue: t.tolerance, 
      hrh2_int: h.hrh2_int 
    });
  }

  const minTol = Math.min(...joined.map(r => r.colorValue ?? Infinity));
  joined.forEach(r => { if (r.colorValue == null) r.colorValue = minTol; });

  return {
    title: "Jones et al.|B2AR Deep Mutational Scanning",
    data: joined,
    colorSpec: {
      type: "continuous",
      colorbarTitle: "Tolerance",
      lowColor: COLOR_RED,
      midColor: COLOR_ORNG,

// (m2) Difference: Normalized Amplitude - Normalized logEC50 (i - k inverted)
async function preparePanel_diff_k_minus_i() {
  const [ec100Data, map, hrh2] = await Promise.all([
    readTSV(ADRB2_ec100_alanine_path),
    readTSV(CONSOLIDATED_mapping_tsv_path),
    readTSV(ADRB2_ec100_scatter_hrh2_path)
  ]);

  // Parse both normalized logEC50 and normalized amplitude
  const dataRows = ec100Data
    .filter(r => r.normalised_logEC50 && r.normalised_logEC50.trim() !== '' && 
                 r.normalised_amplitude && r.normalised_amplitude.trim() !== '' && 
                 r.amino_acid)
    .map(r => ({
      adrb2_pos: firstInt(r.amino_acid),
      logEC50: toNum(r.normalised_logEC50),
      amplitude: toNum(r.normalised_amplitude)
    }))
    .filter(r => r.adrb2_pos != null && r.logEC50 != null && r.amplitude != null && r.amplitude > 0);

  // Normalize both to 0-1
  const logEC50Values = dataRows.map(r => r.logEC50);
  const amplitudeValues = dataRows.map(r => r.amplitude);
  
  const logEC50Normalized = normalizeToZeroOne(logEC50Values);
  const amplitudeNormalized = normalizeToZeroOne(amplitudeValues);
  
  // INVERT logEC50: more negative logEC50 = more potent, so we flip the normalization
  // After flipping: high potency (more negative original) = high normalized value
  const logEC50Inverted = logEC50Normalized.map(v => 1 - v);
  
  // Calculate difference: amplitude - inverted_logEC50
  // Positive = more important for amplitude, Negative = more important for potency
  const dataWithDiff = dataRows.map((r, idx) => ({
    adrb2_pos: r.adrb2_pos,
    difference: amplitudeNormalized[idx] - logEC50Inverted[idx]
  }));

  const mapRows = map.map(r => ({
    hrh2_int: firstInt(r.HRH2_resNum),
    adrb2_int: firstInt(r.ADRB2_resNum)
  })).filter(r => r.hrh2_int && r.adrb2_int);

  const hrh2Rows = hrh2.map(r => ({
    hrh2_int: firstInt(r.HRH2_res_no),
    entropy: toNum(r.entropy),
    conservation: toNum(r.conservation)
  })).filter(r => r.hrh2_int && r.entropy != null && r.conservation != null);

  const merged = [];
  for (const d of dataWithDiff) {
    const m = mapRows.find(k => k.adrb2_int === d.adrb2_pos);
    if (!m) continue;
    
    const h = hrh2Rows.find(h => h.hrh2_int === m.hrh2_int);
    if (!h) continue;
    
    merged.push({ 
      entropy: h.entropy, 
      conservation: h.conservation, 
      colorValue: d.difference, 
      hrh2_int: h.hrh2_int 
    });
  }

  return {
    title: "Heydenreich et al.|B2AR Difference|EC50 Amplitude - EC100 Potency",
    data: merged,
    colorSpec: {
      type: "continuous",
      colorbarTitle: "Amplitude - Potency",
      lowColor: "#1a4d6b",  // dark blue (potency important)
      lowMidColor: "#7caec4",  // light blue
      midColor: COLOR_GREY,  // grey at zero
      highMidColor: COLOR_ORNG,  // orange
      highColor: COLOR_RED,  // red (amplitude important)
      centerAtZero: true,
      greyExtent: 0.7
    }
  };
}

// Boxplot: Conservation vs Entropy for Reduced Positions
async function preparePanel_boxplot_reduced() {
  const [pe, map, hrh2] = await Promise.all([
    readTSV(ADRB2_pe_tsv_path),
    readTSV(CONSOLIDATED_mapping_tsv_path),
    readTSV(ADRB2_scatter_data_path)
  ]);

  const posCol = Object.keys(pe[0] || {}).find(k => k.toLowerCase() === "pos") || "pos";

  // Get positions separately for potency and efficacy that are "reduced"
  const potencyReducedPos = new Set(pe
    .filter(r => r.potency === "reduced")
    .map(r => firstInt(r[posCol]))
    .filter(p => p != null));
  
  const efficacyReducedPos = new Set(pe
    .filter(r => r.efficacy === "reduced")
    .map(r => firstInt(r[posCol]))
    .filter(p => p != null));

  const mapRows = map.map(r => ({
    hrh2_int: firstInt(r.HRH2_resNum),
    adrb2_int: firstInt(r.ADRB2_resNum)
  })).filter(r => r.hrh2_int && r.adrb2_int);

  const hrh2Rows = hrh2.map(r => ({
    hrh2_int: firstInt(r.HRH2_res_no),
    entropy: toNum(r.entropy),
    conservation: toNum(r.conservation)
  })).filter(r => r.hrh2_int && r.entropy != null && r.conservation != null);

  // Get conservation and entropy separately for potency and efficacy
  const conservationPotency = [];
  const entropyPotency = [];
  const conservationEfficacy = [];
  const entropyEfficacy = [];

  // For potency-reducing positions
  for (const adrb2Pos of potencyReducedPos) {
    const m = mapRows.find(k => k.adrb2_int === adrb2Pos);
    if (!m) continue;
    
    const h = hrh2Rows.find(h => h.hrh2_int === m.hrh2_int);
    if (!h) continue;
    
    conservationPotency.push(h.conservation);
    entropyPotency.push(h.entropy);
  }

  // For efficacy-reducing positions
  for (const adrb2Pos of efficacyReducedPos) {
    const m = mapRows.find(k => k.adrb2_int === adrb2Pos);
    if (!m) continue;
    
    const h = hrh2Rows.find(h => h.hrh2_int === m.hrh2_int);
    if (!h) continue;
    
    conservationEfficacy.push(h.conservation);
    entropyEfficacy.push(h.entropy);
  }

  // Get all conservation and entropy values for normalization
  const allConservation = hrh2Rows.map(r => r.conservation);
  const allEntropy = hrh2Rows.map(r => r.entropy);

  // Normalize using the full range
  const consMin = Math.min(...allConservation);
  const consMax = Math.max(...allConservation);
  const entMin = Math.min(...allEntropy);
  const entMax = Math.max(...allEntropy);

  const normalizeCons = (arr) => arr.map(v => (v - consMin) / (consMax - consMin));
  const normalizeEnt = (arr) => arr.map(v => (v - entMin) / (entMax - entMin));

  return {
    title: "Heydenreich et al.|Reduced Potency/Efficacy Positions|Conservation vs Entropy",
    data: {
      Conservation: {
        Potency: normalizeCons(conservationPotency),
        Efficacy: normalizeCons(conservationEfficacy)
      },
      Entropy: {
        Potency: normalizeEnt(entropyPotency),
        Efficacy: normalizeEnt(entropyEfficacy)
      }
    }
  };
}

/* ========================= Build GPCRdb Map ========================= */
async function buildGpcrdbMap() {
  try {
    const map = await readTSV(CONSOLIDATED_mapping_tsv_path);
    const gpcrdbCol = Object.keys(map[0] || {}).find(k => k.toLowerCase().includes("hrh2") && k.toLowerCase().includes("gpcrdb")) || "HRH2_gpcrdb";
    const hrh2Col = Object.keys(map[0] || {}).find(k => k.toLowerCase().includes("hrh2") && k.toLowerCase().includes("resnum")) || "HRH2_resNum";
    
    map.forEach(r => {
      const hrh2_int = firstInt(r[hrh2Col]);
      const gpcrdb = String(r[gpcrdbCol] ?? "").trim();
      if (hrh2_int && gpcrdb) {
        globalGpcrdbMap.set(hrh2_int, gpcrdb);
      }
    });
  } catch (e) {
    console.warn("Could not load GPCRdb mapping:", e);
  }
}

/* ========================= Main Render ========================= */
async function renderAllPanels() {
  try {
    await buildGpcrdbMap();

    // Order: d, e, GPR68, k, o, p, g, h, k2, i2
    const [panelD, panelE, panelGPR68, panelK, panelO, panelP, panelG, panelH, panelK2, panelI2] = await Promise.all([
      preparePanel_d(),
      preparePanel_e(),
      preparePanel_gpr68(),
      preparePanel_k(),
      preparePanel_o(),
      preparePanel_p(),
      preparePanel_g(),
      preparePanel_h(),
      preparePanel_ec100_logEC50_normalized(),
      preparePanel_ec100_normalized()
    ]);

    const svg = d3.select("#svgContainer")
      .append("svg")
      .attr("width", TOTAL_WIDTH)
      .attr("height", TOTAL_HEIGHT)
      .attr("id", "mainSvg");

    // 3 columns × up to 4 rows layout (10 panels)
    const positions = [
      { x: 0, y: 0 }, // a (d - B2AR Tolerance)
      { x: PANEL_WIDTH + PANEL_SPACING_X, y: 0 }, // b (e - MC4R)
      { x: 2 * (PANEL_WIDTH + PANEL_SPACING_X), y: 0 }, // c (GPR68 - Matthew K. Howard)
      { x: 0, y: PANEL_HEIGHT + PANEL_SPACING_Y }, // d (k - V2R)
      { x: PANEL_WIDTH + PANEL_SPACING_X, y: PANEL_HEIGHT + PANEL_SPACING_Y }, // e (o - B2AR G protein)
      { x: 2 * (PANEL_WIDTH + PANEL_SPACING_X), y: PANEL_HEIGHT + PANEL_SPACING_Y }, // f (p - Beta-Arrestin)
      { x: 0, y: 2 * (PANEL_HEIGHT + PANEL_SPACING_Y) }, // g (g - Alanine Potency)
      { x: PANEL_WIDTH + PANEL_SPACING_X, y: 2 * (PANEL_HEIGHT + PANEL_SPACING_Y) }, // h (h - Alanine Efficacy)
      { x: 2 * (PANEL_WIDTH + PANEL_SPACING_X), y: 2 * (PANEL_HEIGHT + PANEL_SPACING_Y) }, // i (k2 - EC100 Normalized logEC50/Potency)
      { x: 0, y: 3 * (PANEL_HEIGHT + PANEL_SPACING_Y) } // j (i2 - EC100 Normalized Amplitude/Efficacy)
    ];

    const scatterPanels = [panelD, panelE, panelGPR68, panelK, panelO, panelP, panelG, panelH, panelK2, panelI2];
    scatterPanels.forEach((panel, i) => {
      const letter = String.fromCharCode(97 + i); // 97 is 'a'
      drawPanel({
        svg: svg,
        x: positions[i].x,
        y: positions[i].y,
        title: `${letter}. ${panel.title}`,
        data: panel.data,
        colorSpec: panel.colorSpec
      });
    });

    console.log("All panels rendered successfully!");
  } catch (e) {
    console.error("Error rendering panels:", e);
    alert("Error rendering plots. See console for details.");
  }
}

/* ========================= SVG Download ========================= */
function downloadSVG() {
  const svgElement = document.getElementById("mainSvg");
  const serializer = new XMLSerializer();
  let svgString = serializer.serializeToString(svgElement);
  
  const styles = `<style type="text/css">
          .axis-label { font-size: 16px; font-family: Arial, sans-serif; }
          .panel-title { font-size: 18px; font-weight: 600; font-family: Arial, sans-serif; }
          .axis line, .axis path { stroke: #333; }
          .axis text { font-size: 14px; fill: #333; font-family: Arial, sans-serif; }
          .grid-line { stroke: #e0e0e0; stroke-width: 0.5; }
          .threshold-line { stroke: #333; stroke-width: 2; stroke-dasharray: 5,5; opacity: 0.5; }
          .legend-text { font-size: 14px; font-family: Arial, sans-serif; }
        </style>`;
  
  if (svgString.includes('<defs>')) {
    svgString = svgString.replace('<defs>', '<defs>' + styles);
  } else {
    svgString = svgString.replace(/(<svg[^>]*>)/, '$1<defs>' + styles + '</defs>');
  }
  
  svgString = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgString;
  
  const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "deep_mutational_scanning.svg";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

}
